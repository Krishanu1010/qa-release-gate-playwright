<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Trail Supply</title>
<style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#16251f;background:#f5f7f4}main{max-width:440px;margin:10vh auto;padding:28px;background:white;border:1px solid #dce5df;border-radius:12px}h1{margin-top:0}.muted{color:#617068}label{display:block;margin:14px 0 6px}input,button{font:inherit;border-radius:7px;padding:10px 12px;width:100%}input{border:1px solid #b9c9bf}button{border:0;background:#176b48;color:white;cursor:pointer;margin-top:18px}a{color:#176b48}#message{min-height:24px;color:#9b312b}</style></head>
<body><main><p class="muted">Trail Supply · quality demo</p><h1>Sign in</h1><p class="muted">Use the synthetic QA account configured for this run.</p>
<form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
<p id="message" role="status" aria-live="polite"></p><a href="/">Back to store</a></main>
<script>
document.querySelector('#login-form').onsubmit=async event=>{event.preventDefault();const message=document.querySelector('#message');message.textContent='';const response=await fetch('/api/session/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});const body=await response.json();if(!response.ok){message.textContent=body.error;return}window.location.assign('/account')};
</script></body></html>
