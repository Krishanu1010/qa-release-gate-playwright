<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trail Supply | QA Demo Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#16251f;background:#f5f7f4}header{background:#143b2d;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}h1{font-size:1.35rem;margin:0}main{max-width:1040px;margin:38px auto;padding:0 20px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}h2{margin:0 0 5px}.muted{color:#617068;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #dce5df;border-radius:12px;padding:20px;display:flex;flex-direction:column;min-height:210px}.tag{color:#397454;font-size:.85rem}.price{font-size:1.25rem;font-weight:700;margin:auto 0 12px}.btn,select,input{font:inherit;border-radius:7px;padding:10px 12px}.btn{border:0;background:#176b48;color:white;cursor:pointer}.btn:disabled{background:#9aa9a0;cursor:not-allowed}select,input{border:1px solid #b9c9bf;background:white}.tools{display:flex;align-items:center;gap:8px}.cart{font-weight:650}.notice{margin-top:20px;padding:14px;background:#e3f3e9;border-radius:8px}.hidden{display:none}.checkout{margin-top:28px;padding:22px;background:white;border:1px solid #dce5df;border-radius:12px}.fields{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}footer{max-width:1040px;margin:30px auto;padding:0 20px;color:#617068;font-size:.9rem}@media(max-width:600px){.intro{align-items:start;flex-direction:column}}
</style></head>
<body><header><h1>Trail Supply <span style="font-weight:400">/ Quality demo store</span></h1><a href="/login" style="color:white">Sign in</a><div class="cart" aria-live="polite">Cart: <span id="cart-count">0</span></div></header>
<main><div class="intro"><div><h2>Field-tested essentials</h2><p class="muted">A small storefront built to demonstrate a realistic QA release gate.</p></div><div class="tools"><label for="sort">Sort</label><select id="sort"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option></select></div></div>
<section id="products" class="grid" aria-label="Products"></section><div id="notice" class="notice hidden" role="status"></div>
<section class="checkout"><h2>Checkout</h2><p class="muted">Enter a name and email to place the order.</p><div class="fields"><label>Name <input id="customer-name" autocomplete="name"></label><label>Email <input id="customer-email" type="email" autocomplete="email"></label><button class="btn" id="checkout">Place order</button></div></section></main><footer>Demo application only. No payment details are collected.</footer>
<script>
const state={items:[],cart:[]};const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
async function load(sort='featured'){const r=await fetch('/api/products'+(sort==='featured'?'':'?sort='+sort));state.items=(await r.json()).items;render()}
function render(){document.querySelector('#products').innerHTML=state.items.map(p=>`<article class="card" data-product="${p.id}"><span class="tag">${p.category}</span><h3>${p.name}</h3><p class="muted">${p.stock===0?'Currently unavailable':p.stock+' in stock'}</p><div class="price">${money(p.price)}</div><button class="btn add" data-id="${p.id}" ${p.stock===0?'disabled':''}>${p.stock===0?'Out of stock':'Add to cart'}</button></article>`).join('');document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{state.cart.push(b.dataset.id);document.querySelector('#cart-count').textContent=state.cart.length;show('Added to cart.')})}
function show(text){const n=document.querySelector('#notice');n.textContent=text;n.classList.remove('hidden')}
document.querySelector('#sort').onchange=e=>load(e.target.value);
document.querySelector('#checkout').onclick=async()=>{if(!state.cart.length){show('Your cart is empty.');return}const name=document.querySelector('#customer-name').value.trim(),email=document.querySelector('#customer-email').value.trim();if(!name||!email){show('Enter your name and email to continue.');return}const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:state.cart,customer:{name,email}})});const data=await r.json();if(!r.ok){show(data.error);return}show(`Order ${data.orderId} confirmed.`);state.cart=[];document.querySelector('#cart-count').textContent='0'};
load();
</script></body></html>
